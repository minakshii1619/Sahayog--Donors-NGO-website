<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NGO Profile — Sahayog</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a class="brand" href="index.html"><span class="mark">S</span>Sahayog</a>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="ngos.html" class="active">Find NGOs</a>
      <a href="register.html">Register your NGO</a>
      <a href="login.html">Log in</a>
    </nav>
    <div class="nav-actions">
      <a class="btn ghost small" href="login.html">Log in</a>
      <a class="btn primary small" href="ngos.html">Donate now</a>
      <button class="menu-toggle" aria-label="Menu">&#9776;</button>
    </div>
  </div>
</header>

<div id="ngo-profile-root">
  <section style="padding-bottom:28px;border-bottom:1px solid var(--line)">
    <div class="wrap">
      <p class="eyebrow"><a href="ngos.html">&larr; Back to directory</a></p>
      <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
        <h2 id="ngo-name" style="font-size:32px"></h2>
        <span class="badge" id="ngo-badge">Verified</span>
      </div>
      <p style="color:var(--text-soft);margin-top:8px" id="ngo-meta"></p>
      <p style="margin-top:18px;max-width:60ch;font-size:15.5px" id="ngo-summary"></p>
      <p style="margin-top:12px">
        <a id="ngo-website" class="btn-ghose-small" href="#" target="_blank" rel="noopener noreferrer">
          Visit Official Website
        </a>
      </p>
    </div>
  </section>

  <section>
    <div class="wrap">
      <div class="section-head" style="margin-bottom:24px">
        <p class="eyebrow">Campaigns</p>
        <h2 style="font-size:26px">Open campaigns from this NGO</h2>
      </div>
      <div class="card-grid cols-2" id="ngo-campaigns">
        
      </div>
    </div>
  </section>
</div>

<footer>
  <div class="wrap">
    <div class="cols">
      <div class="col"><h5>Platform</h5><a href="ngos.html">Find NGOs</a><a href="register.html">Register an NGO</a></div>
      <div class="col"><h5>Account</h5><a href="dashboard-donor.html">Donor dashboard</a><a href="login.html">Log in</a></div>
    </div>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
